<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MT5TITAN — Trade Intelligence</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;background:#0c0f14;color:#f3f5f7}
    body{margin:0;background:#0c0f14}.wrap{max-width:1180px;margin:auto;padding:32px}
    .top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}
    h1{margin:0;font-size:28px}.muted{color:#9299a5}.badge{padding:8px 12px;border-radius:999px;background:#171c24}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:#121720;border:1px solid #242b36;border-radius:16px;padding:18px}
    .wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:span 12}
    button,input,select{background:#0d1219;color:#fff;border:1px solid #303845;border-radius:10px;padding:10px 12px}
    button{cursor:pointer;font-weight:700}.primary{background:#f3f5f7;color:#0c0f14}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    pre{white-space:pre-wrap;word-break:break-word;background:#0a0e13;border-radius:12px;padding:14px;max-height:420px;overflow:auto}
    .metric{font-size:28px;font-weight:800}.ok{color:#7ee787}.warn{color:#f2cc60}.danger{color:#ff7b72}
    table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #242b36;padding:10px}
    @media(max-width:800px){.wide,.side,.full{grid-column:span 12}.wrap{padding:18px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>MT5TITAN</h1>
      <div class="muted">Trade Intelligence Web App</div>
    </div>
    <div id="brokerBadge" class="badge">carregando...</div>
  </div>

  <div class="grid">
    <section class="card wide">
      <h2>Análise</h2>
      <div class="row">
        <input id="symbol" value="DEMO" placeholder="Ativo">
        <select id="timeframe"><option>M1</option><option selected>M5</option><option>M15</option><option>H1</option></select>
        <select id="source"><option value="demo">Demo</option><option value="stored">Importado</option></select>
        <button class="primary" onclick="runMarketAnalysis()">Analisar</button>
        <button onclick="addWatchlist()">+ Watchlist</button>
        <input id="marketFile" type="file" accept=".json,application/json" onchange="importMarketFile(this.files[0])">
      </div>
      <div style="margin-top:20px" class="grid">
        <div class="card side"><div class="muted">Regime</div><div id="regime" class="metric">—</div></div>
        <div class="card side"><div class="muted">Market Score</div><div id="score" class="metric">—</div></div>
        <div class="card side"><div class="muted">Decisão</div><div id="decision" class="metric">—</div></div>
      </div>
      <h3>Sinais</h3>
      <div id="signals"></div>
    </section>

    <aside class="card side">
      <h2>Paper Broker</h2>
      <div class="muted">Saldo</div>
      <div id="balance" class="metric">—</div>
      <div class="row" style="margin-top:16px">
        <input id="stake" type="number" value="100" min="1" style="width:90px">
        <button onclick="paperOrder('BUY')">BUY</button>
        <button onclick="paperOrder('SELL')">SELL</button>
      </div>
      <div id="paperMsg" class="muted" style="margin-top:12px"></div><div style="margin-top:12px"><button onclick="resetPaper()">Reset paper</button></div>
    </aside>

    <section class="card full">
      <h2>Último relatório</h2>
      <pre id="report">Clique em “Analisar demo”.</pre>
    </section>
  </div>
</div>

<script>
let lastPrice = null;
let lastAnalysisId = null;
let lastDecision = null;

async function json(url, options={}) {
  const response = await fetch(url, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.detail || 'Erro na API');
  return body;
}

async function refresh() {
  const brokers = await json('/api/brokers');
  const paper = await json('/api/paper');
  document.getElementById('balance').textContent = '$ ' + paper.balance.toFixed(2);
  document.getElementById('brokerBadge').textContent =
    'Paper: ON · Avalon: ' + (brokers.avalon.connected ? 'ON' : 'aguardando API oficial');
  document.getElementById('paperTrades').innerHTML = renderPaper(paper);
  const history = await json('/api/analyses?limit=12');
  document.getElementById('analysisHistory').innerHTML = renderHistory(history.items);
  const watch = await json('/api/watchlist');
  document.getElementById('watchlist').innerHTML = renderWatchlist(watch.items);
}

function renderPaper(paper) {
  const open = paper.open_trades || [];
  const history = paper.history || [];
  const openRows = open.map(t => '<tr><td>#'+t.trade_id+'</td><td>'+t.symbol+'</td><td>'+t.side+'</td><td>'+t.entry_price+'</td><td><button onclick="settleTrade('+t.trade_id+')">Liquidar</button></td></tr>').join('');
  const historyRows = history.slice(0,8).map(t => '<tr><td>#'+t.trade_id+'</td><td>'+t.side+'</td><td>'+t.pnl+'</td><td>'+(t.won ? 'WIN' : 'LOSS')+'</td><td>'+t.status+'</td></tr>').join('');
  return '<h3>Abertas</h3><table><tr><th>ID</th><th>Ativo</th><th>Lado</th><th>Entrada</th><th></th></tr>'+(openRows || '<tr><td colspan="5">Nenhuma operação aberta.</td></tr>')+'</table><h3>Fechadas</h3><table><tr><th>ID</th><th>Lado</th><th>P&L</th><th>Resultado</th><th>Status</th></tr>'+(historyRows || '<tr><td colspan="5">Sem histórico.</td></tr>')+'</table>';
}

function renderHistory(items) {
  const rows = items.map(a => '<tr><td>#'+a.id+'</td><td>'+a.symbol+'</td><td>'+a.timeframe+'</td><td>'+a.regime+'</td><td>'+a.action+'</td><td>'+Math.round(a.confidence*100)+'%</td><td>'+a.market_score+'</td></tr>').join('');
  return '<table><tr><th>ID</th><th>Ativo</th><th>TF</th><th>Regime</th><th>Decisão</th><th>Conf.</th><th>Score</th></tr>'+(rows || '<tr><td colspan="7">Nenhuma análise salva.</td></tr>')+'</table>';
}

async function settleTrade(id) {
  const price = Number(prompt('Preço de saída', lastPrice || 100));
  if (!price) return;
  await json('/api/paper/settle', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trade_id:id,exit_price:price,payout_ratio:0.82})});
  await refresh();
}

async function resetPaper() {
  await json('/api/paper/reset', {method:'POST'});
  document.getElementById('paperMsg').textContent='Paper resetado.';
  await refresh();
}

function renderWatchlist(items) {
  const rows = items.map(item =>
    '<tr><td>'+item.symbol+'</td><td>'+item.timeframe+'</td><td>'+item.source+'</td>'+
    '<td><button onclick="analyzeWatch(\''+item.symbol+'\',\''+item.timeframe+'\',\''+item.source+'\')">Analisar</button></td>'+
    '<td><button onclick="removeWatch(\''+item.symbol+'\',\''+item.timeframe+'\',\''+item.source+'\')">Remover</button></td></tr>'
  ).join('');
  return '<table><tr><th>Ativo</th><th>TF</th><th>Fonte</th><th></th><th></th></tr>'+
    (rows || '<tr><td colspan="5">Watchlist vazia.</td></tr>')+'</table>';
}

async function analyzeWatch(symbol, timeframe, source) {
  document.getElementById('symbol').value = symbol;
  document.getElementById('timeframe').value = timeframe;
  document.getElementById('source').value = source;
  await runMarketAnalysis();
}

async function addWatchlist() {
  await json('/api/watchlist', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      symbol:document.getElementById('symbol').value,
      timeframe:document.getElementById('timeframe').value,
      source:document.getElementById('source').value
    })
  });
  await refresh();
}

async function removeWatch(symbol, timeframe, source) {
  await json('/api/watchlist?symbol='+encodeURIComponent(symbol)+'&timeframe='+encodeURIComponent(timeframe)+'&source='+encodeURIComponent(source), {method:'DELETE'});
  await refresh();
}

async function importMarketFile(file) {
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const candles = Array.isArray(parsed) ? parsed : parsed.candles;
    if (!Array.isArray(candles)) throw new Error('JSON precisa ser array ou possuir candles.');
    const result = await json('/api/market/import', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        symbol:document.getElementById('symbol').value,
        timeframe:document.getElementById('timeframe').value,
        candles
      })
    });
    document.getElementById('source').value = 'stored';
    document.getElementById('paperMsg').textContent = result.imported+' candles importados.';
  } catch (e) {
    document.getElementById('paperMsg').textContent = e.message;
  }
}

async function runMarketAnalysis() {
  const symbol = document.getElementById('symbol').value || 'DEMO';
  const timeframe = document.getElementById('timeframe').value;
  const source = document.getElementById('source').value;
  const market = await json('/api/market/candles?symbol='+encodeURIComponent(symbol)+'&timeframe='+encodeURIComponent(timeframe)+'&source='+encodeURIComponent(source)+'&count=140');
  lastPrice = market.candles[market.candles.length - 1].close;
  const payload = {
    symbol: market.symbol,
    timeframe: market.timeframe,
    candles: market.candles
  };
  const result = await json('/api/analyze', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  document.getElementById('regime').textContent = result.regime.value;
  document.getElementById('score').textContent = result.market_score.total;
  document.getElementById('decision').textContent = result.decision.action;
  lastAnalysisId = result.analysis_id;
  lastDecision = result.decision.action;
  document.getElementById('signals').innerHTML = '<table><tr><th>Fonte</th><th>Ação</th><th>Confiança</th></tr>' +
    result.signals.map(s => '<tr><td>'+s.source+'</td><td>'+s.action+'</td><td>'+Math.round(s.confidence*100)+'%</td></tr>').join('') + '</table>';
  document.getElementById('report').textContent = JSON.stringify(result, null, 2);
  await refresh();
}

async function paperOrder(side) {
  if (!lastPrice || !lastAnalysisId) return document.getElementById('paperMsg').textContent='Rode uma análise primeiro.';
  if (lastDecision === 'HOLD') return document.getElementById('paperMsg').textContent='A última decisão foi HOLD.';
  if (side !== lastDecision) return document.getElementById('paperMsg').textContent='O lado precisa coincidir com a decisão '+lastDecision+'.';
  try {
    const trade = await json('/api/paper/order', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        analysis_id:lastAnalysisId,
        symbol:document.getElementById('symbol').value || 'DEMO',
        side,
        stake:Number(document.getElementById('stake').value),
        price:lastPrice
      })
    });
    document.getElementById('paperMsg').textContent='Paper trade #' + trade.trade_id + ' aberto.';
    await refresh();
  } catch (e) {
    document.getElementById('paperMsg').textContent=e.message;
  }
}
refresh();
</script>
</body>
</html>
