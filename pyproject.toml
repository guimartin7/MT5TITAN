[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5titan"
version = "0.1.0"
description = "Arquitetura segura para pesquisa quantitativa e automação MT5."
requires-python = ">=3.13"
dependencies = ["tzdata>=2025.3"]

[project.optional-dependencies]
dev = ["pytest>=9.1"]
mt5 = ["MetaTrader5>=5.0.6147"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
